services:
  postgres:
    image: postgres:17-alpine
    container_name: gpuflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpuflow
      POSTGRES_PASSWORD: gpuflow
      POSTGRES_DB: gpuflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpuflow -d gpuflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: gpuflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
